server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend_host backend;
    set $backend_port 8000;
    set $rag_host rag;
    set $rag_port 8100;

    location /api/ {
        proxy_pass http://$backend_host:$backend_port/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ingest {
        proxy_pass http://$rag_host:$rag_port/ingest;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        client_max_body_size 200M;
    }

    location /query {
        proxy_pass http://$rag_host:$rag_port/query;
        proxy_read_timeout 600s;
    }

    location /viewer {
        proxy_pass http://$rag_host:$rag_port/viewer;
    }

    location /api/chroma/ {
        proxy_pass http://$rag_host:$rag_port/api/chroma/;
    }

    location /media/ {
        proxy_pass http://$rag_host:$rag_port/media/;
    }

    location /health {
        proxy_pass http://$backend_host:$backend_port/health;
    }

    location /rag-health {
        proxy_pass http://$rag_host:$rag_port/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
