services:
  - type: web
    name: video-lecture-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"

  - type: web
    name: video-lecture-rag
    runtime: docker
    dockerfilePath: rag/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    disk:
      name: rag-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHROMA_DIR
        value: /data/chroma
      - key: MEDIA_DIR
        value: /data/media

  - type: web
    name: video-lecture-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: VITE_API_URL
        value: /api
      - key: VITE_RAG_API_URL
        value: ""
