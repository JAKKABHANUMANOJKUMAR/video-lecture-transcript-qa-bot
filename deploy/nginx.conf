server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # RAG service (same origin — no CORS issues)
    location /ingest {
        proxy_pass http://rag:8100/ingest;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 200M;
    }
    location /query {
        proxy_pass http://rag:8100/query;
        proxy_read_timeout 120s;
    }
    location /viewer {
        proxy_pass http://rag:8100/viewer;
    }
    location /api/chroma/ {
        proxy_pass http://rag:8100/api/chroma/;
    }

    # Health checks
    location /health {
        proxy_pass http://backend:8000/health;
    }
    location /rag-health {
        proxy_pass http://rag:8100/health;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
