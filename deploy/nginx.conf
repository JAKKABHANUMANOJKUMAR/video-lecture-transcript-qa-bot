server {
    listen 80;
    server_name localhost;

    # Change this path if your repo is in a different location
    root D:/video-lecture-transcript-qa-bot/frontend/dist;
    index index.html;

    client_max_body_size 200M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /ingest {
        proxy_pass http://127.0.0.1:8100/ingest;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        client_max_body_size 200M;
    }

    location /query {
        proxy_pass http://127.0.0.1:8100/query;
        proxy_read_timeout 600s;
    }

    location /viewer {
        proxy_pass http://127.0.0.1:8100/viewer;
    }

    location /api/chroma/ {
        proxy_pass http://127.0.0.1:8100/api/chroma/;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8100/media/;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location /rag-health {
        proxy_pass http://127.0.0.1:8100/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
