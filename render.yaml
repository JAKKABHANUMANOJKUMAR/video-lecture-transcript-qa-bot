# Render Blueprint — deploy all backend services
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: connect GitHub repo → New Blueprint → select render.yaml
# Also create a Neon PostgreSQL database and paste DATABASE_URL into both services.

services:
  # ---- 1. Backend API (auth, users, complaints) ----
  - type: web
    name: ask-ora-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ---- 2. RAG service (Whisper + ChromaDB + Groq) ----
  # Needs more RAM than free tier — use Starter ($7/mo) or Standard
  - type: web
    name: ask-ora-rag
    runtime: docker
    dockerfilePath: rag/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    disk:
      name: rag-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WHISPER_MODEL
        value: tiny
      - key: CHROMA_DIR
        value: /data/chroma
      - key: PYTHON_VERSION
        value: "3.12.0"
