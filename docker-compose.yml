# Run ALL services on ONE machine (single cloud VM — free Oracle tier recommended)
#
# Usage:
#   cp .env.docker.example .env.docker
#   # edit .env.docker — set GROQ_API_KEY and POSTGRES_PASSWORD
#   docker compose --env-file .env.docker up -d --build
#
# Open: http://YOUR_SERVER_IP

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: video_lecture_transcript
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/video_lecture_transcript
      SECRET_KEY: ${SECRET_KEY}
      BACKEND_CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy

  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/video_lecture_transcript
      GROQ_API_KEY: ${GROQ_API_KEY}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      CHROMA_DIR: /data/chroma
    volumes:
      - chroma:/data/chroma
      - hf_cache:/data/hf
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
      args:
        VITE_API_URL: /api
        VITE_RAG_API_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - rag

volumes:
  pgdata:
  chroma:
  hf_cache:
